# Based on .config/prometheus.yml from lab 2.3. Prometheus scrapes the NestJS API on the host every 5 s;
# the default metrics_path /metrics matches the endpoint, which is served outside /api/v1.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "nestjs_notifications"
    static_configs:
      - targets: ["host.docker.internal:8000"]
