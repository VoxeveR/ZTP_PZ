name: ztp

services:
  postgres:
    image: postgres:16
    container_name: postgres_ztp_project1
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Notification channels for testing (from the lab 2.2 compose file).
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog_ztp
    ports:
      - "8025:8025" # UI and API
      - "1025:1025" # SMTP

  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy_ztp
    command: serve
    ports:
      - "8088:80"

  # Metrics scraping (from the lab 2.3 compose file). UI: http://localhost:9090
  prometheus:
    image: prom/prometheus
    container_name: prometheus_ztp
    volumes:
      - ./.config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
